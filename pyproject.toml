[project]
name = "photo-crops-presets"
version = "0.1.0"
description = "photo-crops plus a creative looks engine: saved presets and random exploration with LUTs, textures, overlays and effects, in a Gradio app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers>=0.43.0",
    "exifread>=3.5.1",
    "gradio>=6.31.0",
    "librosa>=1.0.0",
    "numpy",
    "opencv-python-headless",
    "pillow",
    "pillow-heif>=1.8.1",
    "pyobjc-framework-vision>=11",
    "pypdfium2>=5.15.2",
    "pywebview>=6.2.1",
    "rawpy",
    "rembg[cpu]>=2.0.87",
    "resvg-py>=0.5.0",
    "spandrel>=0.4.2",
    "tifffile>=2026.10.15",
    "transformers>=5.23.0",
    "ultralytics",
]

[project.scripts]
photo-crops = "photo_crops.cli:main"
photo-crops-ui = "photo_crops.ui:main"
allprophoto = "photo_presets.studio.server:main"
allprophoto-classic = "photo_presets.app:main"
allprophoto-install-app = "photo_presets.studio.macapp:main"
allprophoto-batch = "photo_presets.cli:main"
# the earlier names still work
photo-presets = "photo_presets.app:main"
photo-presets-batch = "photo_presets.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["photo_crops", "photo_presets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
